name: myapp

services:
  app:
    build:
      context: ..
      dockerfile: docker-setup/Dockerfile
    image: myapp-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_db}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword123}
    ports:
      - "3307:3306"   # host 3307 -> avoids clashing with a local MySQL install
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  node:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
    ports:
      - "5173:5173"   # Vite dev server, exposed the same way we opened it manually before
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  queue:
    build:
      context: ..
      dockerfile: docker-setup/Dockerfile
    image: myapp-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: php artisan queue:work --tries=3 --backoff=3

volumes:
  dbdata:
